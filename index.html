<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index.html</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-size: 24px;
            display: flex;
            }
       img {
            max-width: 100%;       /* Prevents large images from breaking the layout */
            height: auto;
            margin-top: 20px;
            }  
        /* CSS to make the image fit the screen */
        .fit-screen-img {
            max-width: 448px;   /* Fits up to 90% of the screen width */
            max-height: 128px;  /* Fits up to 70% of the screen height */
            width: auto;       /* Maintains original aspect ratio */
            height: auto;      /* Maintains original aspect ratio */
            object-fit: contain; /* Ensures the whole image is visible without cropping */
        }
    </style>
</head>
<body>
    <img class="fit-screen-img" src="Daktronics_Logo.png" alt="Daktronics Logo">
</body>
</html>
